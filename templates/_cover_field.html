<div class="cover-field" data-cover-field data-max-bytes="{{ cover_max_bytes }}" {% if current_cover %}data-saved-src="{{ current_cover }}"{% endif %}>
  <input type="hidden" name="remove_cover" value="" data-remove-cover />
  <div data-cover-slot {% if not current_cover %}hidden{% endif %}>
    <div class="cover-shot">
      <img class="cover-preview" data-cover-preview alt="Cover preview" {% if current_cover %}src="{{ current_cover }}"{% endif %} />
      <button type="button" class="cover-x" data-clear-cover aria-label="Clear cover">× Clear</button>
    </div>
  </div>
  <p class="hint" data-cover-note hidden></p>
  <p class="msg err" data-cover-error hidden role="alert"></p>
  <label>Cover image{% if cover_required %} *{% endif %}
    <span class="hint">{{ cover_hint }}</span>
    <span class="hint">Upload a clean product photo only — no seller-dashboard screenshots, no Chinese UI chrome in the image.</span>
    <input name="cover" type="file" accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif" data-cover-input {% if cover_required %}required{% endif %} />
  </label>
</div>
